# Corrected carbon-cycle parameters for IBIS-JAX.
#
# TWO EMPIRICAL CORRECTIONS, not physical findings. See docs/GPP.md for the
# full elimination trail behind them.
#
#   stomata.vmax   x0.54 of IBIS params.can values
#       Corrects a 1.6x global GPP overestimate whose cause was never found.
#       Every component of the photosynthesis chain was individually verified
#       faithful to F77 or eliminated: the GPP formula (stats.f:118), vmax
#       itself, the 15 C reference temperature, canopy_scaling
#       (physiology.f:418), fu/fl (vegetation.f:525-530), turnover, allocation,
#       specla, leaf area (prescribing MODIS LAI leaves 1.46x), and soil water
#       supply. A single global scalar was chosen over twelve per-PFT values so
#       the residual spatial structure stays visible rather than absorbed.
#
#   bgc.knb, kpb, ksb   x0.67 of F77 params.soi values
#       Corrects soil carbon residence time. Only the terminal loss paths OUT
#       of the soil OM pools are scaled; kbn/kbp are INPUTS to those pools and
#       scaling them would lower soil carbon. Litter rates are untouched --
#       litter was already in range. All 16 BGC rates were first verified to
#       match F77 params.soi exactly, so this is a deliberate deviation from
#       IBIS, not a bug fix.
#
# Everything else -- specla, tauleaf, tauroot, tauwood0, aleaf/aroot/awood,
# stressfac, the litter rates -- is at its F77 or previously-calibrated value.
#
# Validated over 300 years (docs/GPP.md): GPP 1.61x -> 1.01x vs FLUXCOM, and
# Rh, ET, soil carbon, litter and vegetation carbon all inside their observed
# ranges. GPP/NPP remain ~10% high. Fire burned area degrades 0.90x -> 0.78x
# GFED5 because its parameters were fitted against the inflated fuel load and
# have not yet been re-calibrated.
#
