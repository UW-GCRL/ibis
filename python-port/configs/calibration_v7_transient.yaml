# V7: 20yr transient (1990-2010) from 50yr spinup
grid:
  snorth: 90.0
  ssouth: -90.0
  swest: -180.0
  seast: 180.0
  xres: 0.5
  yres: 0.5

time:
  iyear0: 1990
  nrun: 21
  dtime: 3600.0
  irestart: 1950      # year 50 of spinup (iyear0=1901 + 49 = 1950)

physics:
  isimveg: 1
  co2init: 296.0e-6
  o2init: 0.209

output:
  output_dir: /home/min/ibis-jax/output/cal_v7
  restart_dir: /home/min/ibis-jax/restart/cal_v7
  iyearout: 1
  imonthout: 0

forcing:
  forcing_type: gswp3
  gswp3_dir: /shared/nas2/Min/GSWP3
  vegtype_dir: /shared/nas2/Min/ESACCI_LC/ibis_vegtype
  soil_file: /shared/nas2/Min/HWSD/soita.nc
  land_mask_file: /shared/nas2/Min/HWSD/surta.nc
