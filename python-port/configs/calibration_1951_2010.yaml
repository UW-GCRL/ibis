# Calibration transient: 1951-2010 from spinup year 1950 restart
grid:
  snorth: 90.0
  ssouth: -90.0
  swest: -180.0
  seast: 180.0
  xres: 0.5
  yres: 0.5

time:
  iyear0: 1951
  nrun: 60
  dtime: 3600.0
  irestart: 2100      # year 200 of spinup cycling 1901-1910

physics:
  isimveg: 1         # dynamic vegetation: LAI evolves from NPP annually
  co2init: 296.0e-6
  o2init: 0.209

output:
  output_dir: /home/min/ibis-jax/output/cal_v3
  restart_dir: /home/min/ibis-jax/restart/cal_v3
  iyearout: 1
  imonthout: 1
  env_snapshot_dir: /home/min/ibis-jax/output/cal_v3/env_snapshots
  env_snapshot_start: 2000

forcing:
  forcing_type: gswp3
  gswp3_dir: /shared/nas2/Min/GSWP3
  vegtype_dir: /shared/nas2/Min/ESACCI_LC/ibis_vegtype
  soil_file: /shared/nas2/Min/HWSD/soita.nc
  land_mask_file: /shared/nas2/Min/HWSD/surta.nc
