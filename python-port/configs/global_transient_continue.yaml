# IBIS-JAX global transient continue — GSWP3 1971-2010
# Continue from restart/transient/ibis_restart_1970.npz
# Run with: python scripts/run_global.py configs/global_transient_continue.yaml

grid:
  snorth: 90.0
  ssouth: -90.0
  swest: -180.0
  seast: 180.0
  xres: 0.5
  yres: 0.5

time:
  iyear0: 1971
  nrun: 40             # 1971-2010
  dtime: 3600.0
  irestart: 1970       # load from transient restart year 1970

physics:
  isimveg: 0           # static vegetation
  co2init: 296.0e-6
  o2init: 0.209

output:
  output_dir: /home/min/ibis-jax/output/transient
  restart_dir: /home/min/ibis-jax/restart/transient
  iyearout: 1          # write yearly output
  imonthout: 1         # write monthly output (needed for calibration)

forcing:
  forcing_type: gswp3
  gswp3_dir: /shared/nas2/Min/GSWP3
  vegtype_dir: /shared/nas2/Min/ESACCI_LC/ibis_vegtype
  soil_file: /shared/nas2/Min/HWSD/soita.nc
  land_mask_file: /shared/nas2/Min/HWSD/surta.nc
