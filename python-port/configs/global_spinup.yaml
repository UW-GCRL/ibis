# IBIS-JAX global spinup — cycles 1901-1910 GSWP3 for 200 years
# Run with: python scripts/run_global.py configs/global_spinup.yaml
#
# After this completes, the restart at year 200 is your spinup restart.
# Use it as irestart in global_transient.yaml.

grid:
  snorth: 90.0
  ssouth: -90.0
  swest: -180.0
  seast: 180.0
  xres: 0.5
  yres: 0.5

time:
  iyear0: 1          # spinup "years" (not real calendar years)
  nrun: 200          # 200 cycles through the 10-year spinup period
  dtime: 3600.0
  irestart: 0        # cold start

physics:
  isimveg: 0         # hold vegetation static during spinup
  co2init: 296.0e-6  # ~1901 CO2
  o2init: 0.209

output:
  output_dir: /home/min/ibis-jax/output/spinup
  restart_dir: /home/min/ibis-jax/restart/spinup
  iyearout: 10       # write output every 10 spinup cycles

forcing:
  forcing_type: gswp3
  gswp3_dir: /shared/nas2/Min/GSWP3
  vegtype_dir: /shared/nas2/Min/ESACCI_LC/ibis_vegtype
  soil_file: /shared/nas2/Min/HWSD/soita.nc
  land_mask_file: /shared/nas2/Min/HWSD/surta.nc
  spinup_year_start: 1901   # cycle this GSWP3 period
  spinup_year_end: 1910
