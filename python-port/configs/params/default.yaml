    TminU: -45.0
    Twarm: 9999.0
    GDD: 350.0
    tauleaf: 2.5
    tauroot: 1.0
    tauwood0: 100.0
    specla: 12.5
    aleaf: 0.30
    aroot: 0.40
    awood: 0.30
  boreal_broadleaf_deciduous:
    TminL: -57.5
    TminU: -45.0
    Twarm: 9999.0
    GDD: 350.0
    tauleaf: 1.0
    tauroot: 1.0
    tauwood0: 100.0
    specla: 25.0
    aleaf: 0.30
    aroot: 0.20
    awood: 0.50
  boreal_conifer_deciduous:
    TminL: 9999.0
    TminU: -45.0
    Twarm: 9999.0
    GDD: 350.0
    tauleaf: 1.0
    tauroot: 1.0
    tauwood0: 100.0
