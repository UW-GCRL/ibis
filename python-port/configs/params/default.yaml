    TminU: 0.0
    Twarm: 9999.0
    GDD: 9999.0
    tauleaf: 1.0
    tauroot: 1.0
    tauwood0: 25.0
    specla: 25.0
    aleaf: 0.30
    aroot: 0.20
    awood: 0.50
  temperate_conifer_evergreen:
    TminL: -45.0
    TminU: 0.0
    Twarm: 9999.0
    GDD: 1200.0
    tauleaf: 2.0
    tauroot: 1.0
    tauwood0: 50.0
    specla: 12.5
    aleaf: 0.30
    aroot: 0.40
    awood: 0.30
  temperate_broadleaf_deciduous:
