# IBIS-JAX default physics parameters
# All values match the hardcoded defaults in the Python source.
# Reference this file from a simulation config with:
#   params_file: configs/params/default.yaml

stomata:
  # Universal photosynthesis biochemistry (not PFT-specific)
  tau15: 4500.0
  kc15: 1.5e-4
  ko15: 0.25
  cimax: 2000.0e-6
  o2conc: 0.209
  alpha3: 0.080
  theta3: 0.950
  beta3: 0.990
  alpha4: 0.050
  theta4: 0.970
  beta4: 0.800
  stressfac: -5.0

  # Ball-Berry stomatal conductance — by stomata group
  # Groups: broadleaf, conifer, shrub, c4_grass, c3_grass
  ball_berry:
    broadleaf: {gamma: 0.015, coefm: 10.0, coefb: 0.01, gsmin: 1.0e-5}
    conifer:   {gamma: 0.015, coefm:  6.0, coefb: 0.01, gsmin: 1.0e-5}
    shrub:     {gamma: 0.015, coefm:  9.0, coefb: 0.01, gsmin: 1.0e-5}
    c4_grass:  {gamma: 0.030, coefm:  4.0, coefb: 0.04, gsmin: 1.0e-5}
    c3_grass:  {gamma: 0.015, coefm:  9.0, coefb: 0.01, gsmin: 1.0e-5}

  # Max carboxylation rate (mol/m2/s) — by PFT
  vmax:
    tropical_broadleaf_evergreen:       65.0e-6
    tropical_broadleaf_deciduous:       65.0e-6
    warm_temperate_broadleaf_evergreen: 40.0e-6
    temperate_conifer_evergreen:        30.0e-6
    temperate_broadleaf_deciduous:      30.0e-6
    boreal_conifer_evergreen:           25.0e-6
    boreal_broadleaf_deciduous:         30.0e-6
    boreal_conifer_deciduous:           30.0e-6
    evergreen_shrub:                    27.5e-6
    deciduous_shrub:                    27.5e-6
    c4_grass:                           15.0e-6
    c3_grass:                           25.0e-6

pft:
  # Bioclimatic limits, turnover, allocation — one entry per PFT
  # TminL/TminU: coldest-month temperature bounds (°C); 9999 = unconstrained
  # Twarm: warmest-month threshold (°C); 9999 = unconstrained
  # GDD: growing degree-day threshold; tauleaf/tauroot/tauwood0: turnover (years)
  # specla: specific leaf area (m2/kgC); aleaf/aroot/awood: C allocation fractions
  tropical_broadleaf_evergreen:
    TminL: 0.0
    TminU: 9999.0
    Twarm: 9999.0
    GDD: 9999.0
    tauleaf: 1.01
    tauroot: 1.0
    tauwood0: 25.0
    specla: 25.0
    aleaf: 0.30
    aroot: 0.20
    awood: 0.50
  tropical_broadleaf_deciduous:
    TminL: 0.0
    TminU: 9999.0
    Twarm: 9999.0
    GDD: 9999.0
    tauleaf: 1.0
    tauroot: 1.0
    tauwood0: 25.0
    specla: 25.0
    aleaf: 0.30
    aroot: 0.20
    awood: 0.50
  warm_temperate_broadleaf_evergreen:
