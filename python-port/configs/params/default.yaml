    aleaf: 0.30
    aroot: 0.20
    awood: 0.50
  evergreen_shrub:
    TminL: 9999.0
    TminU: 9999.0
    Twarm: 9999.0
    GDD: 100.0
    tauleaf: 1.5
    tauroot: 1.0
    tauwood0: 5.0
    specla: 12.5
    aleaf: 0.45
    aroot: 0.40
    awood: 0.15
  deciduous_shrub:
    TminL: 9999.0
    TminU: 9999.0
    Twarm: 9999.0
    GDD: 100.0
    tauleaf: 1.0
    tauroot: 1.0
    tauwood0: 5.0
    specla: 25.0
    aleaf: 0.45
    aroot: 0.35
    awood: 0.20
  c4_grass:
    TminL: 9999.0
    TminU: 9999.0
    Twarm: 22.0
    GDD: 100.0
    tauleaf: 1.25
    tauroot: 1.0
    tauwood0: 999.0
    specla: 20.0
    aleaf: 0.45
    aroot: 0.55
    awood: 0.00
  c3_grass:
    TminL: 9999.0
    TminU: 9999.0
    Twarm: 9999.0
    GDD: 100.0
    tauleaf: 1.5
    tauroot: 1.0
    tauwood0: 999.0
    specla: 20.0
    aleaf: 0.45
