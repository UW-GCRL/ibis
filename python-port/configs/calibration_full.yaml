# Full calibration run: spinup restart → 1990-2010
# Uses properly converted restart with valid state
grid:
  snorth: 90.0
  ssouth: -90.0
  swest: -180.0
  seast: 180.0
  xres: 0.5
  yres: 0.5

time:
  iyear0: 1901
  nrun: 110            # 1901-2010 (full transient)
  dtime: 3600.0
  irestart: 200     # properly converted spinup restart

physics:
  isimveg: 0
  co2init: 296.0e-6
  o2init: 0.209

output:
  output_dir: /home/min/ibis-jax/output/calibration2
  restart_dir: /home/min/ibis-jax/restart/spinup
  iyearout: 1
  imonthout: 1         # monthly output (needed for ILAMB comparison)
  env_snapshot_dir: /home/min/ibis-jax/output/calibration2/env_snapshots
  env_snapshot_start: 2000   # save snapshots only for 2000-2010

forcing:
  forcing_type: gswp3
  gswp3_dir: /shared/nas2/Min/GSWP3
  vegtype_dir: /shared/nas2/Min/ESACCI_LC/ibis_vegtype
  soil_file: /shared/nas2/Min/HWSD/soita.nc
  land_mask_file: /shared/nas2/Min/HWSD/surta.nc
