# Quick spinup for calibration: 50 years cycling 1901-1910
grid:
  snorth: 90.0
  ssouth: -90.0
  swest: -180.0
  seast: 180.0
  xres: 0.5
  yres: 0.5

time:
  iyear0: 1901
  nrun: 200
  dtime: 3600.0
  irestart: 0          # cold start

physics:
  isimveg: 1         # dynamic vegetation: LAI evolves from NPP annually
  co2init: 296.0e-6
  o2init: 0.209

output:
  output_dir: /home/min/ibis-jax/output/cal_spinup_v3
  restart_dir: /home/min/ibis-jax/restart/cal_v3
  iyearout: 50         # write every 50 years (save disk)
  imonthout: 0

forcing:
  forcing_type: gswp3
  gswp3_dir: /shared/nas2/Min/GSWP3
  vegtype_dir: /shared/nas2/Min/ESACCI_LC/ibis_vegtype
  soil_file: /shared/nas2/Min/HWSD/soita.nc
  land_mask_file: /shared/nas2/Min/HWSD/surta.nc
  spinup_year_start: 1901
  spinup_year_end: 1910
