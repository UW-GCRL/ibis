# V4: Calibrated parameters, static vegetation, 50yr spinup + 60yr transient
# vmax_pft × 0.85, specla × 0.46, isimveg=0

grid:
  snorth: 90.0
  ssouth: -90.0
  swest: -180.0
  seast: 180.0
  xres: 0.5
  yres: 0.5

time:
  iyear0: 1901
  nrun: 50
  dtime: 3600.0
  irestart: 0

physics:
  isimveg: 0           # static vegetation from ESACCI
  co2init: 296.0e-6
  o2init: 0.209

output:
  output_dir: /home/min/ibis-jax/output/cal_v4_spinup
  restart_dir: /home/min/ibis-jax/restart/cal_v4
  iyearout: 50
  imonthout: 0

forcing:
  forcing_type: gswp3
  gswp3_dir: /shared/nas2/Min/GSWP3
  vegtype_dir: /shared/nas2/Min/ESACCI_LC/ibis_vegtype
  soil_file: /shared/nas2/Min/HWSD/soita.nc
  land_mask_file: /shared/nas2/Min/HWSD/surta.nc
  spinup_year_start: 1901
  spinup_year_end: 1910
