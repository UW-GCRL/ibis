# IBIS-JAX global transient run — GSWP3 1901-2010
# Run with: python scripts/run_global.py configs/global_transient.yaml
#
# Start from spinup restart (irestart: 200 = restart saved at spinup year 200).

grid:
  snorth: 90.0
  ssouth: -90.0
  swest: -180.0
  seast: 180.0
  xres: 0.5
  yres: 0.5

time:
  iyear0: 1901
  nrun: 110          # 1901–2010
  dtime: 3600.0
  irestart: 200      # load restart from spinup year 200

physics:
  isimveg: 0         # 0=static vegetation; 1=update ESACCI annually
  co2init: 296.0e-6
  o2init: 0.209

output:
  output_dir: /home/min/ibis-jax/output/transient
  restart_dir: /home/min/ibis-jax/restart/transient
  iyearout: 1        # write output every year

forcing:
  forcing_type: gswp3
  gswp3_dir: /shared/nas2/Min/GSWP3
  vegtype_dir: /shared/nas2/Min/ESACCI_LC/ibis_vegtype
  soil_file: /shared/nas2/Min/HWSD/soita.nc
  land_mask_file: /shared/nas2/Min/HWSD/surta.nc
  # spinup_year_start: 0  (0 = disabled, use actual calendar years)
